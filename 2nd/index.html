<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day 2 — Scratch & Win</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    min-height: 100vh;
    font-family: "Baloo 2", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 28px 16px 40px;
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.12), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(255, 255, 255, 0.1), transparent 45%),
      repeating-linear-gradient(135deg, #5b1a8c 0px, #5b1a8c 60px, #7a1fae 60px, #7a1fae 120px);
    color: #fff8e7;
  }

  #confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }

  .confetti-piece {
    position: absolute;
    top: -10%;
    animation-name: confetti-fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform;
  }

  @keyframes confetti-fall {
    0% { transform: translateY(0) translateX(0) rotate(0deg); }
    50% { transform: translateY(55vh) translateX(22px) rotate(200deg); }
    100% { transform: translateY(115vh) translateX(-16px) rotate(400deg); }
  }

  .title-block,
  .scratch-grid,
  .actions {
    position: relative;
    z-index: 1;
  }

  .title-block {
    display: inline-block;
    margin-bottom: 64px;
    padding: 18px 32px;
    border-radius: 20px;
    background: linear-gradient(135deg, #e91e8c 0%, #f9a825 100%);
    border: 4px dashed #ffe082;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), inset 0 0 0 2px rgba(255, 255, 255, 0.3);
  }

  h2 {
    margin: 0;
    font-family: "Luckiest Guy", cursive;
    font-weight: 400;
    letter-spacing: 1.5px;
    font-size: clamp(1.9rem, 5.5vw, 2.8rem);
    color: #fffdf6;
    text-shadow: 2px 2px 0 #7a1fae, -1px -1px 0 #7a1fae, 0 6px 14px rgba(0, 0, 0, 0.35);
  }

  .subtitle {
    margin: 6px 0 0;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff3cf;
  }

  .scratch-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 22px;
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
  }

  .scratch-slot {
    position: relative;
    aspect-ratio: 3 / 4;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
    background: #fff;
    touch-action: none;
    border: 3px solid #ffe082;
  }

  .reward-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #fff6e0, #ffd166);
  }

  .scratch-slot.is-lost .reward-layer {
    background: linear-gradient(160deg, #e7e2da, #c9c2b6);
  }

  .scratch-slot.slot-win {
    animation: slot-win-pulse 1s ease-in-out infinite;
  }

  @keyframes slot-win-pulse {
    0%, 100% { box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.0), 0 14px 28px rgba(0, 0, 0, 0.35); }
    50% { box-shadow: 0 0 0 6px rgba(46, 204, 113, 0.7), 0 14px 28px rgba(0, 0, 0, 0.35); }
  }

  .reward-layer .reward-emoji {
    font-size: clamp(2.6rem, 9vw, 3.6rem);
    line-height: 1;
  }

  .scratch-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transition: opacity 0.6s ease;
  }

  /* ---- stamp overlay ---- */
  .stamp-overlay {
    position: absolute;
    inset: -10px;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transform: scale(0.7) rotate(-10deg);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.3, 1.4, 0.4, 1);
  }

  .stamp-overlay.show {
    opacity: 1;
    transform: scale(1) rotate(-8deg);
  }

  .stamp-overlay .stamp-text {
    font-family: "Luckiest Guy", cursive;
    font-weight: 400;
    letter-spacing: 2px;
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    padding: 14px 36px;
    border: 5px solid currentColor;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(1px);
  }

  .stamp-overlay.won .stamp-text {
    color: #2ecc71;
    text-shadow: 0 0 10px rgba(46, 204, 113, 0.6);
  }

  .stamp-overlay.lost .stamp-text {
    color: #e74c3c;
    text-shadow: 0 0 10px rgba(231, 76, 60, 0.6);
  }

  /* ---- inventory ---- */
  .inventory {
    position: relative;
    z-index: 1;
    margin-top: 40px;
    width: 100%;
    max-width: 760px;
  }

  .inventory-title {
    margin: 0 0 14px;
    font-size: 0.95rem;
    font-weight: 700;
    color: #fff3cf;
    letter-spacing: 0.5px;
  }

  .inventory-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
  }

  .inv-slot {
    position: relative;
    width: 58px;
    height: 58px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid rgba(255, 255, 255, 0.25);
    opacity: 0.4;
    transition: opacity 0.3s ease, transform 0.3s ease, background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .inv-slot.collected {
    opacity: 1;
    background: rgba(255, 255, 255, 0.18);
    border-color: #ffe082;
    box-shadow: 0 0 14px rgba(255, 224, 130, 0.5);
    transform: scale(1.08);
  }

  .inv-count {
    position: absolute;
    bottom: -6px;
    right: -6px;
    background: #e91e8c;
    color: #fff;
    font-size: 0.65rem;
    font-weight: 800;
    border-radius: 999px;
    min-width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    border: 2px solid #fff3cf;
  }

  .claim-btn {
    display: none;
    margin-top: 24px;
    border: none;
    background: linear-gradient(135deg, #2ecc71, #27ae60);
    color: #fff;
    font-family: "Baloo 2", sans-serif;
    font-weight: 800;
    font-size: 1.05rem;
    padding: 14px 30px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
    transition: transform 0.15s ease;
  }

  .claim-btn.visible {
    display: inline-block;
  }

  .claim-btn:hover {
    transform: translateY(-2px);
  }

  .claim-btn:active {
    transform: scale(0.96);
  }

  .actions {
    margin-top: 32px;
  }

  .back-link {
    display: inline-block;
    color: #fff8e7;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 700;
    border: 1px solid rgba(255, 248, 231, 0.5);
    padding: 8px 18px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div id="confetti-container"></div>

  <div class="title-block">
    <h2>🎪 Scratch &amp; Win 🎪</h2>
    <p class="subtitle">Scratch all 5 cards to see what's underneath</p>
  </div>

  <div style="position: relative; width: 100%; max-width: 1000px;">
    <div class="scratch-grid" id="scratchGrid">
      <div class="scratch-slot" data-index="0">
        <div class="reward-layer"></div>
        <canvas class="scratch-canvas"></canvas>
      </div>
      <div class="scratch-slot" data-index="1">
        <div class="reward-layer"></div>
        <canvas class="scratch-canvas"></canvas>
      </div>
      <div class="scratch-slot" data-index="2">
        <div class="reward-layer"></div>
        <canvas class="scratch-canvas"></canvas>
      </div>
      <div class="scratch-slot" data-index="3">
        <div class="reward-layer"></div>
        <canvas class="scratch-canvas"></canvas>
      </div>
      <div class="scratch-slot" data-index="4">
        <div class="reward-layer"></div>
        <canvas class="scratch-canvas"></canvas>
      </div>
    </div>
    <div class="stamp-overlay" id="stampOverlay"><div class="stamp-text" id="stampText"></div></div>
  </div>

  <div class="inventory">
    <p class="inventory-title">Your collection</p>
    <div class="inventory-grid" id="inventoryGrid"></div>
    <button class="claim-btn" id="claimBtn">🏆 Claim your prize</button>
  </div>

  <div class="actions">
    <a class="back-link" href="../index.html">← Back to calendar</a>
  </div>

<script>
  const REVEAL_THRESHOLD = 0.6; // auto-clear once this fraction is scratched
  const BRUSH_RADIUS_CSS = 22; // px, in CSS pixels

  const REWARD_TYPES = [
    { key: "lost", label: "Lost", emoji: "🚽", weight: 25 },
    { key: "kiss", label: "One Kiss", emoji: "💋", weight: 20 },
    { key: "hug", label: "One Hug", emoji: "🤗", weight: 15 },
    { key: "massage", label: "Massage Session", emoji: "💆", weight: 10 },
    { key: "bike", label: "Bike Ride", emoji: "🚴", weight: 10 },
    { key: "dinner", label: "All-Inclusive Autistic Dinner", emoji: "🍽️", weight: 10 },
    { key: "plant", label: "Plant Gift", emoji: "🪴", weight: 5 },
    { key: "yesday", label: "Yes Day in Bed", emoji: "🍑", weight: 3 },
    { key: "french", label: "French Lesson", emoji: "🥖", weight: 2 },
  ];

  // Chance a round ends in a win at all. Which specific reward wins (when it
  // does) is then chosen from WINNABLE_TYPES using the hierarchy above — the
  // two are decided independently so the win rate can be tuned directly
  // instead of emerging from 5-card-draw combinatorics.
  const WIN_RATE = 0.7;
  const WINNABLE_TYPES = REWARD_TYPES.filter((t) => t.key !== "lost");

  function pickWeighted(list) {
    const total = list.reduce((sum, t) => sum + t.weight, 0);
    let r = Math.random() * total;
    for (const type of list) {
      if (r < type.weight) return type;
      r -= type.weight;
    }
    return list[list.length - 1];
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Builds one round's 5 card outcomes. First decides win/lose directly via
  // WIN_RATE, then fills in the cards to match: exactly 3-of-a-kind for a
  // win (plus 2 unrelated fillers), or a shuffle that's guaranteed to avoid
  // any accidental 3-of-a-kind for a loss.
  function generateRoundCards() {
    const results = new Array(5);

    if (Math.random() < WIN_RATE) {
      const winType = pickWeighted(WINNABLE_TYPES);
      const positions = shuffle([0, 1, 2, 3, 4]);
      positions.slice(0, 3).forEach((pos) => {
        results[pos] = winType;
      });
      const fillerPool = REWARD_TYPES.filter((t) => t.key !== winType.key);
      positions.slice(3).forEach((pos) => {
        results[pos] = pickWeighted(fillerPool);
      });
    } else {
      for (let attempt = 0; attempt < 50; attempt++) {
        const tally = {};
        let valid = true;
        for (let i = 0; i < 5; i++) {
          const pick = pickWeighted(REWARD_TYPES);
          const nextCount = (tally[pick.key] || 0) + 1;
          if (pick.key !== "lost" && nextCount >= 3) {
            valid = false;
            break;
          }
          tally[pick.key] = nextCount;
          results[i] = pick;
        }
        if (valid) break;
      }
      // Extremely unlikely fallback: guarantee every slot is filled even if
      // 50 attempts somehow all failed, by padding with "lost" (never wins).
      const lostType = REWARD_TYPES.find((t) => t.key === "lost");
      for (let i = 0; i < 5; i++) {
        if (!results[i]) results[i] = lostType;
      }
    }

    return results;
  }

  function setupScratchCanvas(canvas) {
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);

    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Foil background
    const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
    grad.addColorStop(0, "#d8dde2");
    grad.addColorStop(0.5, "#aab2bb");
    grad.addColorStop(1, "#c7ccd1");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, rect.width, rect.height);

    // Diagonal stripe texture
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 6;
    for (let x = -rect.height; x < rect.width; x += 14) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x + rect.height, rect.height);
      ctx.stroke();
    }

    canvas._ctx = ctx;
    canvas._cssWidth = rect.width;
    canvas._cssHeight = rect.height;
    canvas._revealed = false;
  }

  function scratchAt(canvas, x, y) {
    const ctx = canvas._ctx;
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(x, y, BRUSH_RADIUS_CSS, 0, Math.PI * 2);
    ctx.fill();
  }

  function scratchLine(canvas, x0, y0, x1, y1) {
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const steps = Math.max(1, Math.ceil(dist / (BRUSH_RADIUS_CSS / 2)));
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      scratchAt(canvas, x0 + (x1 - x0) * t, y0 + (y1 - y0) * t);
    }
  }

  function checkRevealProgress(canvas, onRevealed) {
    if (canvas._revealed) return;
    const ctx = canvas._ctx;
    const sampleSize = 32;
    const dpr = window.devicePixelRatio || 1;
    let data;
    try {
      data = ctx.getImageData(0, 0, canvas.width, canvas.height);
    } catch (e) {
      return;
    }
    let cleared = 0;
    const total = sampleSize * sampleSize;
    const stepX = Math.max(1, Math.floor(canvas.width / sampleSize));
    const stepY = Math.max(1, Math.floor(canvas.height / sampleSize));
    let counted = 0;
    for (let y = 0; y < canvas.height; y += stepY) {
      for (let x = 0; x < canvas.width; x += stepX) {
        const idx = (y * canvas.width + x) * 4 + 3;
        if (data.data[idx] < 16) cleared++;
        counted++;
      }
    }
    if (counted > 0 && cleared / counted >= REVEAL_THRESHOLD) {
      canvas._revealed = true;
      canvas.style.opacity = "0";
      setTimeout(() => {
        canvas.style.pointerEvents = "none";
      }, 650);
      if (onRevealed) onRevealed();
    }
  }

  function attachScratchHandlers(slot, onRevealed) {
    const canvas = slot.querySelector(".scratch-canvas");
    setupScratchCanvas(canvas);

    let scratching = false;
    let lastX = 0;
    let lastY = 0;
    let moveCount = 0;

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener("pointerdown", (e) => {
      if (canvas._revealed) return;
      canvas.setPointerCapture(e.pointerId);
      scratching = true;
      const pos = getPos(e);
      lastX = pos.x;
      lastY = pos.y;
      scratchAt(canvas, pos.x, pos.y);
    });

    canvas.addEventListener("pointermove", (e) => {
      if (!scratching || canvas._revealed) return;
      const pos = getPos(e);
      scratchLine(canvas, lastX, lastY, pos.x, pos.y);
      lastX = pos.x;
      lastY = pos.y;
      moveCount++;
      if (moveCount % 4 === 0) checkRevealProgress(canvas, onRevealed);
    });

    function stop(e) {
      if (!scratching) return;
      scratching = false;
      checkRevealProgress(canvas, onRevealed);
    }

    canvas.addEventListener("pointerup", stop);
    canvas.addEventListener("pointercancel", stop);
    canvas.addEventListener("pointerleave", stop);

    window.addEventListener("resize", () => {
      if (canvas._revealed) return;
      const rect = canvas.getBoundingClientRect();
      const changed =
        Math.abs(rect.width - canvas._cssWidth) > 1 ||
        Math.abs(rect.height - canvas._cssHeight) > 1;
      if (changed) setupScratchCanvas(canvas);
    });
  }

  // --- assign a weighted-random reward to each of today's 5 cards ---
  const slotEls = Array.from(document.querySelectorAll(".scratch-slot"));
  let cardResults = [];
  let lastRoundOutcome = null; // { won, type } of the most recently completed round

  // --- inventory (persists across rounds for the whole session) ---
  const inventoryGrid = document.getElementById("inventoryGrid");
  const inventoryCounts = {};
  const invSlotEls = {};

  REWARD_TYPES.forEach((type) => {
    inventoryCounts[type.key] = 0;
    const el = document.createElement("div");
    el.className = "inv-slot";
    el.title = type.label;
    el.innerHTML = type.emoji;
    inventoryGrid.appendChild(el);
    invSlotEls[type.key] = el;
  });

  function updateInventorySlot(key) {
    const el = invSlotEls[key];
    el.classList.add("collected");
    let badge = el.querySelector(".inv-count");
    if (!badge) {
      badge = document.createElement("span");
      badge.className = "inv-count";
      el.appendChild(badge);
    }
    badge.textContent = "×" + inventoryCounts[key];
  }

  // --- round tracking ---
  let revealedTotal = 0;
  const stampOverlay = document.getElementById("stampOverlay");
  const stampText = document.getElementById("stampText");
  const claimBtn = document.getElementById("claimBtn");
  claimBtn.classList.add("visible");

  function handleCardRevealed(index) {
    revealedTotal++;
    if (revealedTotal === slotEls.length) onAllRevealed();
  }

  function computeRoundOutcome() {
    const tally = {};
    cardResults.forEach((r) => {
      if (r.key === "lost") return;
      tally[r.key] = (tally[r.key] || 0) + 1;
    });
    let winningType = null;
    for (const type of REWARD_TYPES) {
      if (tally[type.key] >= 3) {
        winningType = type;
        break;
      }
    }
    return { won: !!winningType, type: winningType };
  }

  function onAllRevealed() {
    const outcome = computeRoundOutcome();
    lastRoundOutcome = outcome;

    if (outcome.won) {
      slotEls.forEach((slot, i) => {
        if (cardResults[i].key === outcome.type.key) slot.classList.add("slot-win");
      });
      inventoryCounts[outcome.type.key]++;
      updateInventorySlot(outcome.type.key);
      stampOverlay.classList.add("show", "won");
      stampText.textContent = "🎉 You win: " + outcome.type.label + "! 🎉";
    } else {
      inventoryCounts.lost++;
      updateInventorySlot("lost");
      stampOverlay.classList.add("show", "lost");
      stampText.textContent = "😅 No match — try again!";
    }

    setTimeout(startNewRound, 2800);
  }

  function startNewRound() {
    stampOverlay.classList.remove("show", "won", "lost");
    revealedTotal = 0;
    cardResults = generateRoundCards();

    slotEls.forEach((slot, i) => {
      const result = cardResults[i];
      slot.classList.remove("is-lost", "slot-win");
      if (result.key === "lost") slot.classList.add("is-lost");

      const layer = slot.querySelector(".reward-layer");
      layer.innerHTML = '<span class="reward-emoji">' + result.emoji + "</span>";

      const canvas = slot.querySelector(".scratch-canvas");
      // Snap back to fully opaque instantly, bypassing the reveal fade
      // transition — otherwise the new round's emoji is visible underneath
      // while the fresh foil fades in from opacity 0.
      canvas.style.transition = "none";
      setupScratchCanvas(canvas);
      canvas.style.opacity = "1";
      canvas.style.pointerEvents = "auto";
      void canvas.offsetWidth; // force reflow so the "none" transition applies
      canvas.style.transition = "";
    });
  }

  slotEls.forEach((slot, i) => {
    attachScratchHandlers(slot, () => handleCardRevealed(i));
  });

  startNewRound();

  // --- claim & download summary image ---
  claimBtn.addEventListener("click", () => {
    const canvas = document.createElement("canvas");
    const W = 1000, H = 680;
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");

    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#5b1a8c");
    bg.addColorStop(1, "#7a1fae");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffe082";
    ctx.font = "700 46px 'Baloo 2', sans-serif";
    ctx.fillText("🎪 Scratch & Win — Day 2 🎪", W / 2, 90);

    ctx.fillStyle = "#ffffff";
    ctx.font = "700 28px 'Baloo 2', sans-serif";
    ctx.fillText("Your collection so far", W / 2, 150);

    const invCols = 3;
    const invCellW = 260, invCellH = 150;
    const invStartX = (W - invCellW * invCols) / 2 + invCellW / 2;
    const invStartY = 250;
    REWARD_TYPES.forEach((type, i) => {
      const col = i % invCols;
      const row = Math.floor(i / invCols);
      const cx = invStartX + col * invCellW;
      const cy = invStartY + row * invCellH;
      const collected = inventoryCounts[type.key] > 0;

      ctx.globalAlpha = collected ? 1 : 0.35;
      ctx.fillStyle = collected ? "rgba(255,255,255,0.18)" : "rgba(255,255,255,0.06)";
      ctx.beginPath();
      ctx.roundRect(cx - 110, cy - 55, 220, 110, 16);
      ctx.fill();

      ctx.font = "54px sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText(type.emoji, cx, collected ? cy - 2 : cy + 10);

      if (collected) {
        ctx.font = "600 15px 'Baloo 2', sans-serif";
        ctx.fillStyle = "#fff3cf";
        wrapText(ctx, type.label + " ×" + inventoryCounts[type.key], cx, cy + 32, 200, 16);
      }
      ctx.globalAlpha = 1;
    });

    ctx.font = "600 16px 'Baloo 2', sans-serif";
    ctx.fillStyle = "#fff3cf";
    ctx.fillText(new Date().toLocaleDateString(), W / 2, H - 30);

    const link = document.createElement("a");
    link.download = "day2-scratch-results.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split(" ");
    let line = "";
    let lines = [];
    for (const word of words) {
      const test = line ? line + " " + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    const startY = y - ((lines.length - 1) * lineHeight) / 2;
    lines.forEach((l, i) => ctx.fillText(l, x, startY + i * lineHeight));
  }

  (function confetti() {
    const EMOJIS = ["🎉", "🎊", "✨", "⭐", "🎟️"];
    const container = document.getElementById("confetti-container");
    const count = window.innerWidth < 600 ? 16 : 28;
    for (let i = 0; i < count; i++) {
      const span = document.createElement("span");
      span.className = "confetti-piece";
      span.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
      span.style.left = Math.random() * 100 + "vw";
      const duration = 8 + Math.random() * 10;
      const delay = Math.random() * duration;
      span.style.animationDuration = duration + "s";
      span.style.animationDelay = "-" + delay + "s";
      span.style.fontSize = 14 + Math.random() * 16 + "px";
      span.style.opacity = 0.5 + Math.random() * 0.4;
      container.appendChild(span);
    }
  })();
</script>
