<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day 3 — Movie Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    min-height: 100vh;
    font-family: "Baloo 2", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 32px 16px 40px;
    position: relative;
    overflow-x: hidden;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(0, 0, 0, 0.5), transparent 60%),
      linear-gradient(180deg, #121224 0%, #181a30 55%, #1e1430 100%);
    color: #f4ecff;
  }

  /* subtle film-grain so the background doesn't read as a flat vector gradient */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncR type='linear' slope='2.4' intercept='-0.7'/><feFuncG type='linear' slope='2.4' intercept='-0.7'/><feFuncB type='linear' slope='2.4' intercept='-0.7'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  #lights-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 130px;
    pointer-events: none;
    overflow: visible;
    z-index: 0;
  }

  #lights-container svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .bulb {
    animation: bulb-flicker 4s ease-in-out infinite;
  }

  @keyframes bulb-flicker {
    0%, 96%, 100% { opacity: 1; }
    97%, 99% { opacity: 0.55; }
  }

  .title-block,
  .shelf-section,
  .actions {
    position: relative;
    z-index: 1;
  }

  .title-block {
    margin-bottom: 20px;
  }

  h2 {
    margin: 0;
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: clamp(2.8rem, 6.5vw, 4.6rem);
    color: #ffd166;
    text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.55);
  }

  .subtitle {
    margin: 10px 0 0;
    font-size: 1.3rem;
    font-weight: 700;
    color: #cfc4e8;
  }

  .shelf-section {
    width: 100%;
    max-width: 1500px;
    margin-top: 40px;
  }

  .shelf-scroll {
    overflow-x: auto;
    /* overflow-x: auto implicitly forces overflow-y to auto too, which
       would otherwise clip the spines as they lift on hover/focus — the
       extra top padding gives that lift room to breathe instead. */
    padding: 28px 8px 18px;
    margin-top: -28px;
  }

  .shelf-row {
    display: inline-flex;
    align-items: flex-end;
    gap: 10px;
    padding: 0 10px;
  }

  .dvd-spine {
    flex: 0 0 auto;
    width: 98px;
    height: 400px;
    border-radius: 8px 8px 3px 3px;
    cursor: pointer;
    position: relative;
    display: flex;
    justify-content: center;
    padding-top: 24px;
    box-shadow: 5px 5px 8px rgba(0, 0, 0, 0.45);
    transition: transform 0.22s ease, box-shadow 0.22s ease;
  }

  .dvd-spine:hover,
  .dvd-spine:focus-visible {
    transform: translateY(-30px) rotate(0deg) !important;
    box-shadow: 6px 14px 20px rgba(0, 0, 0, 0.5);
  }

  .dvd-spine .spine-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.7px;
    color: rgba(255, 255, 255, 0.95);
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    white-space: nowrap;
  }

  .dvd-spine .spine-icon {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2.2rem;
  }

  .shelf-ledge {
    position: relative;
    height: 38px;
    max-width: 1500px;
    width: calc(100% - 20px);
    margin: -4px auto 0;
    background: linear-gradient(180deg, #6b4428 0%, #4a2d18 100%);
    border-radius: 6px;
    box-shadow: 0 14px 26px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  .shelf-ledge::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.55;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='40'><filter id='w'><feTurbulence type='turbulence' baseFrequency='0.012 0.35' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncR type='linear' slope='1.8' intercept='-0.35'/><feFuncG type='linear' slope='1.8' intercept='-0.35'/><feFuncB type='linear' slope='1.8' intercept='-0.35'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23w)'/></svg>");
    background-size: 300px 68px;
  }

  .shelf-ledge::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.18) 0%, transparent 35%, transparent 70%, rgba(0, 0, 0, 0.25) 100%);
  }

  .shelf-hint {
    margin-top: 18px;
    font-size: 1.15rem;
    color: #b7abd6;
  }

  /* ---- cover reveal overlay ---- */
  .cover-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 4, 15, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 20px;
  }

  .cover-overlay.open {
    display: flex;
  }

  .cover-card {
    width: min(90vw, 560px);
    border-radius: 26px;
    padding: 46px 38px;
    text-align: center;
    box-shadow: 0 20px 34px rgba(0, 0, 0, 0.45);
    transform: scale(0.85);
    opacity: 0;
    animation: pop-in 0.35s ease forwards;
  }

  @keyframes pop-in {
    to { transform: scale(1); opacity: 1; }
  }

  .cover-card .cover-icon {
    font-size: 6.2rem;
    margin-bottom: 14px;
  }

  .cover-card .cover-title {
    font-family: "Playfair Display", serif;
    font-weight: 700;
    font-size: 2.3rem;
    color: #fff;
    margin: 0 0 10px;
  }

  .cover-card .cover-tagline {
    font-size: 1.15rem;
    color: rgba(255, 255, 255, 0.85);
    margin: 0 0 30px;
  }

  .cover-actions {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .book-btn {
    border: none;
    background: #ffd166;
    color: #2a1a00;
    font-family: "Baloo 2", sans-serif;
    font-weight: 800;
    font-size: 1.35rem;
    padding: 18px 30px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.4);
    transition: transform 0.15s ease;
  }

  .book-btn:hover {
    transform: translateY(-2px);
  }

  .book-btn:active {
    transform: scale(0.96);
  }

  .putback-btn {
    border: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.75);
    font-family: "Baloo 2", sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    padding: 8px;
    cursor: pointer;
    text-decoration: underline;
  }

  .back-link {
    display: inline-block;
    margin-top: 40px;
    color: #cfc4e8;
    text-decoration: none;
    font-size: 1.2rem;
    font-weight: 700;
    border: 1px solid rgba(207, 196, 232, 0.4);
    padding: 12px 26px;
    border-radius: 999px;
  }
</style>
</head>
<body>
  <div id="lights-container"></div>

  <div class="title-block">
    <h2>🎬 Pick Tonight's Saga</h2>
    <p class="subtitle">Movie night — her pick, all the way through</p>
  </div>

  <div class="shelf-section">
    <div class="shelf-scroll">
      <div class="shelf-row" id="shelfRow"></div>
    </div>
    <div class="shelf-ledge"></div>
    <p class="shelf-hint">👉 Pull a DVD off the shelf to pick tonight's saga</p>
  </div>

  <a class="back-link" href="../index.html">← Back to calendar</a>

  <div class="cover-overlay" id="coverOverlay">
    <div class="cover-card" id="coverCard">
      <div class="cover-icon" id="coverIcon"></div>
      <p class="cover-title" id="coverTitle"></p>
      <p class="cover-tagline">Tonight's pick, if you want it</p>
      <div class="cover-actions">
        <button class="book-btn" id="bookBtn">📀 Book Movie Night</button>
        <button class="putback-btn" id="putBackBtn">Put it back on the shelf</button>
      </div>
    </div>
  </div>

<script>
  const SAGAS = [
    { title: "High School Musical", icon: "🏀", color1: "#b3122c", color2: "#7a0c1e", textColor: "#ffffff" },
    { title: "Harry Potter", icon: "⚡", color1: "#7a1f1f", color2: "#4a1212", textColor: "#ffd166" },
    { title: "Twilight", icon: "🌲", color1: "#162035", color2: "#0a101e", textColor: "#cfd8ff" },
    { title: "Amélie Poulain", icon: "🍒", color1: "#b43a2e", color2: "#2e5c3a", textColor: "#ffe9c9" },
    { title: "La La Land", icon: "🎹", color1: "#5b3d8c", color2: "#b4477a", textColor: "#ffffff" },
    { title: "All Ghibli Movies", icon: "🍃", color1: "#3f7f63", color2: "#245244", textColor: "#eafff0" },
    { title: "Pride & Prejudice", icon: "💌", color1: "#8a7250", color2: "#5c4a30", textColor: "#fff6e6" },
    { title: "The Hunger Games", icon: "🔥", color1: "#1a1a1a", color2: "#3a2b0f", textColor: "#ffcf4d" },
    { title: "Legally Blonde", icon: "💗", color1: "#d6487e", color2: "#a82f5e", textColor: "#ffffff" },
  ];

  const shelfRow = document.getElementById("shelfRow");
  const coverOverlay = document.getElementById("coverOverlay");
  const coverCard = document.getElementById("coverCard");
  const coverIcon = document.getElementById("coverIcon");
  const coverTitle = document.getElementById("coverTitle");
  const bookBtn = document.getElementById("bookBtn");
  const putBackBtn = document.getElementById("putBackBtn");

  let currentSaga = null;

  SAGAS.forEach((saga) => {
    const spine = document.createElement("div");
    spine.className = "dvd-spine";
    spine.style.background = `linear-gradient(180deg, ${saga.color1} 0%, ${saga.color2} 100%)`;
    // Slight per-spine lean, like real DVDs settled on a shelf rather than
    // machine-aligned — removed on hover/focus (see .dvd-spine:hover rule).
    const lean = (Math.random() * 3.4 - 1.7).toFixed(2);
    spine.style.transform = `rotate(${lean}deg)`;
    spine.tabIndex = 0;
    spine.setAttribute("role", "button");
    spine.setAttribute("aria-label", "Pick " + saga.title);

    const label = document.createElement("span");
    label.className = "spine-label";
    label.textContent = saga.title;
    label.style.color = saga.textColor;
    spine.appendChild(label);

    const icon = document.createElement("span");
    icon.className = "spine-icon";
    icon.textContent = saga.icon;
    spine.appendChild(icon);

    function openCover() {
      currentSaga = saga;
      coverCard.style.background = `linear-gradient(160deg, ${saga.color1} 0%, ${saga.color2} 100%)`;
      coverIcon.textContent = saga.icon;
      coverTitle.textContent = saga.title;
      coverTitle.style.color = saga.textColor;
      coverCard.style.animation = "none";
      void coverCard.offsetWidth;
      coverCard.style.animation = "";
      coverOverlay.classList.add("open");
    }

    spine.addEventListener("click", openCover);
    spine.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openCover();
      }
    });

    shelfRow.appendChild(spine);
  });

  putBackBtn.addEventListener("click", () => {
    coverOverlay.classList.remove("open");
  });

  coverOverlay.addEventListener("click", (e) => {
    if (e.target === coverOverlay) coverOverlay.classList.remove("open");
  });

  bookBtn.addEventListener("click", () => {
    if (!currentSaga) return;
    const canvas = document.createElement("canvas");
    const W = 1000, H = 420;
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");

    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, currentSaga.color1);
    bg.addColorStop(1, currentSaga.color2);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = "rgba(255,255,255,0.6)";
    ctx.setLineDash([14, 10]);
    ctx.lineWidth = 3;
    ctx.strokeRect(20, 20, W - 40, H - 40);
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.moveTo(W - 230, 20);
    ctx.lineTo(W - 230, H - 20);
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.setLineDash([10, 8]);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd166";
    ctx.font = "700 26px 'Baloo 2', sans-serif";
    ctx.fillText("🎬 MOVIE NIGHT TICKET 🎬", (W - 230) / 2 + 20, 70);

    ctx.font = "110px sans-serif";
    ctx.fillText(currentSaga.icon, (W - 230) / 2 + 20, 210);

    ctx.fillStyle = "#ffffff";
    ctx.font = "700 40px 'Baloo 2', sans-serif";
    ctx.fillText(currentSaga.title, (W - 230) / 2 + 20, 280);

    ctx.font = "600 20px 'Baloo 2', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.fillText("Admit one — redeemable anytime", (W - 230) / 2 + 20, 330);

    ctx.save();
    ctx.translate(W - 115, H / 2);
    ctx.rotate(Math.PI / 2);
    ctx.fillStyle = "#ffd166";
    ctx.font = "700 22px 'Baloo 2', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("ADMIT ONE", 0, -10);
    ctx.font = "600 16px 'Baloo 2', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fillText(currentSaga.title.toUpperCase(), 0, 20);
    ctx.restore();

    ctx.textAlign = "left";
    ctx.font = "600 16px 'Baloo 2', sans-serif";
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fillText("🍿  Popcorn included, salty obviously", 40, H - 40);

    const link = document.createElement("a");
    link.download = "movie-night-ticket.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });

  (function stringLights() {
    const container = document.getElementById("lights-container");
    const width = 1200;
    const segments = window.innerWidth < 600 ? 5 : 8;
    const baseY = 22;
    const sagY = 92;
    const stemLen = 20;
    const bulbR = 9;
    const colors = ["#ffd166", "#ff8a5c", "#ffd166", "#ffb74d"];

    const segWidth = width / segments;
    let pathD = `M0,${baseY}`;
    let bulbsSvg = "";

    for (let i = 0; i < segments; i++) {
      const x0 = i * segWidth;
      const x2 = (i + 1) * segWidth;
      const xc = (x0 + x2) / 2;
      pathD += ` Q${xc.toFixed(1)},${sagY} ${x2.toFixed(1)},${baseY}`;

      const px = 0.25 * x0 + 0.5 * xc + 0.25 * x2;
      const py = 0.25 * baseY + 0.5 * sagY + 0.25 * baseY;
      const color = colors[i % colors.length];
      const delay = (Math.random() * 4).toFixed(2);

      bulbsSvg += `
        <line x1="${px.toFixed(1)}" y1="${py.toFixed(1)}" x2="${px.toFixed(1)}" y2="${(py + stemLen).toFixed(1)}" stroke="#2b2b2b" stroke-width="1.5"/>
        <circle class="bulb" cx="${px.toFixed(1)}" cy="${(py + stemLen + bulbR).toFixed(1)}" r="${bulbR}" fill="${color}" style="animation-delay:${delay}s"/>
        <ellipse cx="${(px - 2).toFixed(1)}" cy="${(py + stemLen + bulbR - 2).toFixed(1)}" rx="1.6" ry="2.4" fill="rgba(255,255,255,0.65)"/>
      `;
    }

    container.innerHTML = `
      <svg viewBox="0 0 ${width} 158" preserveAspectRatio="none" aria-hidden="true">
        <path d="${pathD}" fill="none" stroke="#2b2b2b" stroke-width="2"/>
        ${bulbsSvg}
      </svg>
    `;
  })();
</script>
</body>
</html>
