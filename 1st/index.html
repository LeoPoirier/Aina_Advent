<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Day 1 — Sweeter than Yogurt</title>
<style>
  @font-face {
    font-family: "Honey So Sweety";
    src: url("Honey so Sweety Regular.otf") format("opentype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: "Amsahoney";
    src: url("Amsahoney-Regular.ttf") format("truetype");
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 24px 16px;
    overflow: hidden;
    background: radial-gradient(circle at 50% 0%, #fffdf6 0%, #f5ecd6 70%, #f0e4c7 100%);
    color: #7a6a4f;
  }

  .title-block {
    flex: 0 0 auto;
  }

  h2 {
    margin: 0;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 900;
    color: #9c2a4a;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
  }

  .subtitle {
    margin: 4px 0 0;
    font-size: 0.8rem;
    color: #b9ab8c;
  }

  .bowl-stage {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .bowl-frame {
    position: relative;
    line-height: 0;
  }

  .bowl-frame img {
    display: block;
    height: min(78vh, 78vw);
    width: auto;
    filter: drop-shadow(0 25px 35px rgba(90, 70, 40, 0.25));
  }

  @media (max-width: 640px) {
    .bowl-frame img {
      height: auto;
      width: 135vw;
    }
  }

  .circle-guide {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 73.2422%;
    aspect-ratio: 1 / 1;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 2px dashed rgba(156, 42, 74, 0.45);
    pointer-events: none;
    display: none;
  }

  .sweet-text {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 66%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-family: "Amsahoney", cursive;
    font-size: clamp(3rem, 9.4vw, 5rem);
    line-height: 1.12;
    color: #9c2a4a;
    word-break: break-word;
    overflow-wrap: anywhere;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }

  .sweet-text.visible {
    opacity: 1;
  }

  .actions {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding-top: 12px;
  }

  .reveal-btn {
    border: none;
    background: #c4453c;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    padding: 12px 26px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.15);
    transition: transform 0.15s ease, background 0.2s ease;
  }

  .reveal-btn:hover {
    background: #a8352d;
    transform: translateY(-2px);
  }

  .reveal-btn:active {
    transform: scale(0.96);
  }

  .back-link {
    display: inline-block;
    color: #7a6a4f;
    text-decoration: none;
    font-size: 0.9rem;
    border: 1px solid #c9bd9d;
    padding: 8px 18px;
    border-radius: 999px;
  }


</style>
</head>
<body>

      <div class="sweet-text" id="sweetText"></div>
    </div>
  </div>

  <div class="actions">
    <button class="reveal-btn" id="revealBtn">🥣 Reveal a sweet word</button>
    <a class="back-link" href="../index.html">← Back to calendar</a>
  </div>

</html>
